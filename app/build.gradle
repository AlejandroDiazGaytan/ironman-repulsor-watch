plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starkindustries.repulsor'
    compileSdk 34

    defaultConfig {
        applicationId "com.starkindustries.repulsor"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android SDK for maximum speed and compatibility on Galaxy Watch 6 (Wear OS)
}
