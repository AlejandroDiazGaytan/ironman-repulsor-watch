name: Build Galaxy Watch 6 Repulsor APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Iron Man Repulsor Wear OS APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Convert & Generate All 3 Audio Effects (Charge, Blast, Reverse Cancel)
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        if [ -f app/src/main/res/raw/repulsor_charge.m4a ]; then
          ffmpeg -y -i app/src/main/res/raw/repulsor_charge.m4a -vn -acodec pcm_s16le -ar 44100 -ac 1 app/src/main/res/raw/repulsor_charge.wav
          ffmpeg -y -i app/src/main/res/raw/repulsor_charge.m4a -vn -af "areverse" -acodec pcm_s16le -ar 44100 -ac 1 app/src/main/res/raw/repulsor_cancel.wav
          rm app/src/main/res/raw/repulsor_charge.m4a
        fi
        if [ -f app/src/main/res/raw/repulsor_blast.m4a ]; then
          ffmpeg -y -i app/src/main/res/raw/repulsor_blast.m4a -vn -acodec pcm_s16le -ar 44100 -ac 1 app/src/main/res/raw/repulsor_blast.wav
          rm app/src/main/res/raw/repulsor_blast.m4a
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Wear OS APK
      run: |
        gradle assembleDebug --stacktrace

    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk IronMan-Repulsor-Watch6.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronMan-Repulsor-Watch6-APK
        path: IronMan-Repulsor-Watch6.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Iron Man Repulsor v2.0.0 (Carga + Disparo + Cancelación)"
        body: |
          ### 🦾 Iron Man Repulsor v2.0 (MK-85) para Samsung Galaxy Watch 6
          - ⚡ **1. Levantar la mano (Carga):** Sonido de carga + anillos acelerados en estado listo.
          - 💥 **2. Empujón / Sacudida o Toque (Disparo):** Sonido de cañón de plasma + onda expansiva dorada/blanca + golpe háptico.
          - 🔉 **3. Bajar la mano sin disparar (Cancelación):** Audio de carga invertido (`areverse`) + giro en reversa descargando el reactor.
        files: IronMan-Repulsor-Watch6.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
